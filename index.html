<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Project 3C’s Scanner</title>

  <!-- TAB LOGO / FAVICON -->
  <link rel="icon" type="image/png" href="logo.png">

  <link rel="stylesheet" href="style.css">

  <!-- Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<!-- ================= HEADER ================= -->
<header>
  <img src="logo.png" alt="Logo" class="logo">
  <h1>Project 3C’s Scanner</h1>
  <h2>Through Knowledge and Life We Protect What’s Right</h2>
  <h3>Sillawit National High School</h3>
</header>

<!-- ================= UPLOADER ================= -->
<section class="uploader">
  <h2>Upload Evaluation Sheet</h2>

  <input type="file" id="fileInput" accept="image/*,.pdf"><br><br>

  <label>
    Section:
    <input type="text" id="section" placeholder="Diamond">
  </label>

  <label>
    Day:
    <input type="number" id="day" min="1" max="100">
  </label>

  <label>
    Evaluator:
    <div class="eye-wrap">
      <input type="password" id="evaluator" placeholder="Officer Name">
      <button type="button" onclick="toggleEye()">👁️</button>
    </div>
  </label>

  <br><br>

  <!-- ACTION BUTTONS -->
  <button onclick="processFile()">Process</button>
  <button onclick="exportExcel()">Export Excel</button>
  <button onclick="runTest()">🧪 Run Test Demo</button>
</section>

<!-- ================= RESULTS TABLE ================= -->
<section>
  <h2>Extracted Results</h2>
  <table id="resultsTable">
    <thead>
      <tr>
        <th>Tool</th>
        <th>Category</th>
        <th>Criteria</th>
        <th>Score</th>
        <th>%</th>
        <th>Notes</th>
      </tr>
    </thead>
    <tbody id="resultsBody">
      <tr>
        <td colspan="6" style="text-align:center;">
          No data yet.
        </td>
      </tr>
    </tbody>
  </table>
</section>

<!-- ================= COMPARISON CHART ================= -->
<section>
  <h2>OLD vs NEW Comparison</h2>
  <canvas id="comparisonChart"></canvas>
</section>

<!-- ================= MUSIC ================= -->
<audio id="bg-music" autoplay loop muted>
  <source src="njz falling behind.mp3" type="audio/mpeg">
</audio>

<button id="muteBtn" onclick="toggleMute()">🔇 Unmute</button>

<!-- ================= FOOTER ================= -->
<footer>
  <p>&copy; 2025 Youth for Environment in Schools Organization – Sillawit NHS</p>
</footer>

<!-- ================= SCRIPT ================= -->
<script src="script.js"></script>
</body>
</html>
